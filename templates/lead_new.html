{% extends "base.html" %}
{% block title %}Neuer Lead{% endblock %}
{% block page_title %}<a href="{{ url_for('leads') }}" class="muted" style="font-weight:400">Leads</a> <span class="muted">/</span> Neuer Lead{% endblock %}
{% block content %}
<form class="panel" method="post" style="max-width:640px">
  <div class="panel-header"><i class="bi bi-plus-lg"></i> Neuer Lead</div>
  <div class="panel-body gap10">
    <div><label>Firma *</label><input type="text" name="company" required autofocus></div>
    <div class="grid2">
      <div><label>Ansprechpartner</label><input type="text" name="contact_name"></div>
      <div><label>Telefon</label><input type="text" name="contact_phone"></div>
      <div><label>E-Mail</label><input name="contact_email" type="email"></div>
      <div><label>Zweite E-Mail (optional)</label><input name="contact_email2" type="email"></div>
      <div><label>Ort</label><input type="text" name="location"></div>
      <div><label>Termin</label><input name="event_date" type="date"></div>
      <div><label>Zuständig</label>
        <select name="assigned_to">
          <option value="">— niemand —</option>
          {% for u in team %}<option value="{{ u.id }}" {{ 'selected' if me and me.id == u.id }}>{{ u.name }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div><label>Anfrage / Notizen</label><textarea name="notes" rows="4"></textarea></div>
    <div><button class="btn btn-primary">Lead anlegen</button></div>
  </div>
</form>
{% endblock %}
