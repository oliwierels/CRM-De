<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ title }} – 33bots</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
:root { --bg: #f5f6fa; --card: #fff; --text: #1d2130; --muted: #6b7080; --line: #e2e5ee; --accent: #5b5ef4; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111318; --card: #1c1e26; --text: #dde1f0; --muted: #8a8fa0; --line: #2a2d38; --accent: #6d70ff; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg);
       color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 32px 26px; max-width: 440px; width: 100%; text-align: center; }
.icon { font-size: 46px; line-height: 1; margin-bottom: 14px; }
h1 { font-size: 21px; margin: 0 0 8px; }
p { color: var(--muted); margin: 0 0 6px; }
.code { font-size: 12px; color: var(--muted); margin-top: 16px; }
a.btn { display: inline-block; margin-top: 18px; background: var(--accent); color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; }
a.mail { color: var(--accent); font-weight: 600; text-decoration: none; }
.brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; margin-bottom: 18px; }
.brand img { width: 26px; height: 26px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img src="/static/favicon.svg" alt=""> 33bots</div>
  <div class="icon">{{ icon }}</div>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if contact %}<p><a class="mail" href="mailto:{{ contact }}">{{ contact }}</a></p>{% endif %}
  {% if back_url %}<a class="btn" href="{{ back_url }}">{{ back_label }}</a>{% endif %}
  <div class="code">{{ code }}</div>
</div>
</body>
</html>
