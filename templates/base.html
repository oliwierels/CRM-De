<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Leads{% endblock %} · Posevo CRM</title>
<style>
:root {
  --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
  --accent: #2f5bea; --accent-soft: #e8eefd; --ok: #13804b; --ok-soft: #e3f5ea; --warn: #b35c00; --warn-soft: #fdf0e1;
  --danger: #c0352b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161b; --card: #1d2027; --text: #e8eaf0; --muted: #949bab; --line: #2c3039;
    --accent: #6d8dff; --accent-soft: #232c45; --ok: #4fc58a; --ok-soft: #1a3027; --warn: #f0a24d; --warn-soft: #35291a;
    --danger: #ff6b5e;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
a { color: var(--accent); text-decoration: none; }
header { background: var(--card); border-bottom: 1px solid var(--line); }
.bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; color: var(--text); }
.brand span { color: var(--accent); }
nav { display: flex; gap: 4px; }
nav a { padding: 6px 10px; border-radius: 6px; color: var(--muted); }
nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.me { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
h1 { font-size: 22px; margin: 0 0 14px; }
h2 { font-size: 16px; margin: 0 0 10px; }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%; }
textarea { min-height: 80px; resize: vertical; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
.btn { display: inline-block; font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 7px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.link { border: 0; background: none; color: var(--danger); padding: 0; font-weight: 400; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill.unterschrieben { background: var(--ok-soft); color: var(--ok); }
.pill.nicht_unterschrieben { background: var(--warn-soft); color: var(--warn); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.flash { background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
@media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } .me { margin-left: 0; width: 100%; } .hide-sm { display: none; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="{{ url_for('leads') }}">Posevo <span>CRM</span></a>
    <nav>
      <a href="{{ url_for('leads') }}" class="{{ 'on' if request.endpoint in ('leads', 'lead_detail', 'lead_new') }}">Leads</a>
      <a href="{{ url_for('calculator') }}" class="{{ 'on' if request.endpoint == 'calculator' }}">Kalkulator</a>
      <a href="{{ url_for('team') }}" class="{{ 'on' if request.endpoint == 'team' }}">Team</a>
      <a href="{{ url_for('settings') }}" class="{{ 'on' if request.endpoint == 'settings' }}">Einstellungen</a>
    </nav>
    <div class="me">
      {% if team %}
        Ich bin:
        <select onchange="if(this.value) location.href='/ich/'+this.value+'?next='+encodeURIComponent(location.pathname+location.search)" style="width:auto">
          <option value="">— auswählen —</option>
          {% for u in team %}<option value="{{ u.id }}" {{ 'selected' if me and me.id == u.id }}>{{ u.name }}</option>{% endfor %}
        </select>
      {% else %}
        <a href="{{ url_for('team') }}">Team anlegen</a>
      {% endif %}
    </div>
  </div>
</header>
<main>
  {% for msg in get_flashed_messages() %}<div class="flash">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
